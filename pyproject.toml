[build-system]
requires = ["setuptools==75.6.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitlog"
version = "0.0.1"
description = "Spacecraft fault diagnosis with small LMs under hard memory caps"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "pyyaml==6.0.2",
  "jsonschema==4.23.0",
  "numpy==2.1.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cfs: needs the orbitlog-cfs image and a running Docker daemon"]
